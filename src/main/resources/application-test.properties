# Test configuration
spring.config.import=optional:file:.env[.properties]

# PostgreSQL exposed by Docker Compose to the host
spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB:order_management_db}

# Moderate logging during tests
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.flywaydb=INFO